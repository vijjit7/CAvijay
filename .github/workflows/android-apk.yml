name: Build Android APK

# Builds the native app's debug APK in the cloud so no local Android SDK is needed.
# Download the result from the run's "Artifacts" section (app-debug.apk).
on:
  workflow_dispatch: {} # lets you trigger a build from the Actions tab on demand
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "android-webdir/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Regenerates the Capacitor files that are intentionally not committed
      # (plugin project, copied web assets, generated config).
      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
